<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>switchboard — task {{ID}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/swb-1.css">
  <style>{{STYLE}}</style>
</head>
<body>
  <div class="headbar">
  <nav><a href="/tasks">Board</a> <a href="/plans">Plans</a> <a href="/briefs">Briefs</a> <a href="/deliveries">Deliveries</a> <a href="/sources">Sources</a> <a href="/funnel">Funnel</a></nav>
  </div>
  <header class="sign">
    <a class="back" href="/tasks">&larr; Board</a>
    <div class="signblock"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.5 19h19v2h-19zM22.1 9.6c-.2-.8-1-1.3-1.8-1.1L15 10 8.1 3.5l-1.9.5 4.1 7.2-5 1.3-2-1.5-1.4.4 1.8 3.2.8 1.3 1.6-.4 5.3-1.4 4.4-1.2 5.3-1.4c.8-.2 1.3-1.1 1-1.9z"/></svg></div>
    <h1>Switchboard <small>Task {{ID}}</small></h1>
  </header>
  <div class="page">
  <h1>#{{ID}} TASKDETAIL NOLINK no link at all</h1>
  <table>
    <tr><th>status</th><td>ready</td><th>project</th><td>itest-taskdetail-proj</td></tr>
    <tr><th>assignee</th><td>human</td>
        <th>autonomy</th><td></td></tr>
    <tr><th>priority</th><td>1</td><th>plan order</th><td></td></tr>
    <tr><th>parent</th><td>—</td>
        <th>updated</th><td class="muted">{{STAMP}}</td></tr>
  </table>

  
  <section class="verbs" aria-label="actions">
    
    <form method="post" action="/tasks/{{ID}}/close">
      
      <input type="text" name="note" placeholder="note (optional)">
      <button class="go">Done</button>
    </form>
    
    <form method="post" action="/tasks/{{ID}}/dismiss">
      
      <select name="reason_code">
        <option value="not_actionable">not actionable</option>
        <option value="wrong_kind">wrong kind</option>
        <option value="duplicate">duplicate</option>
        <option value="handled_elsewhere">handled elsewhere</option>
      </select>
      <input type="text" name="note" placeholder="note (optional)">
      <button>Dismiss</button>
    </form>
    
    <form method="post" action="/tasks/{{ID}}/attach">
      
      <input type="number" name="target_task_id" min="1" placeholder="task #" required>
      <input type="text" name="note" placeholder="note (optional)">
      <button>Attach</button>
    </form>
  </section>

  <h2>Body</h2><pre>NOLINK placeholder card body.
second line.</pre>

  

  

  

  

  

  

  
  </div>
</body>
</html>
